name: Deploy web beta

on:
  push:
    branches: [claude/racing-game-requirements-iswd3u]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Test world generation and physics
        run: cargo test --release -p worldgen -p vehicle -p game --test shaders
      - name: Build
        run: ./scripts/build-web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
