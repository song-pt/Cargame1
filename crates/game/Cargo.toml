[package]
name = "game"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worldgen = { path = "../worldgen" }
vehicle = { path = "../vehicle" }
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance", "console"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
